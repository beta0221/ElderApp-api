# 開發模式 override — docker-compose up 時自動套用
# 生產部署請用: docker-compose -f docker-compose.yml up
services:
  app:
    build:
      target: app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/var/www/html                  # 掛載原始碼，PHP 改完立即生效
      - vendor_data:/var/www/html/vendor # 保留 image 裡編譯好的 vendor
      - ./storage:/var/www/html/storage

  db:
    ports:
      - "3307:3306"

  web:
    volumes:
      - ./public:/var/www/html/public:ro          # Nginx 從 host 讀取編譯產物
      - public_images:/var/www/html/public/images

volumes:
  vendor_data:
