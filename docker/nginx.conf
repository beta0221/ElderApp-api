server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Static files served directly by Nginx
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other requests: try static file first, then rewrite to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP requests proxied to PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        # Use the app container's document root path (not nginx's)
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
